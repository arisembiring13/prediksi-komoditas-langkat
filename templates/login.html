<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Prediksi Komoditas Langkat</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;

            background:
                radial-gradient(circle at 20% 25%,
                    rgba(255,255,255,0.12) 0 55px,
                    transparent 56px),

                radial-gradient(circle at 85% 20%,
                    rgba(255,255,255,0.08) 0 45px,
                    transparent 46px),

                radial-gradient(circle at 90% 80%,
                    rgba(34,197,94,0.20) 0 40px,
                    transparent 41px),

                linear-gradient(
                    135deg,
                    #0d6efd 0%,
                    #1683f8 50%,
                    #0d6efd 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 20px;
        }


        /* ================================
           CARD LOGIN
        ================================= */

        .login-card {

            width: 100%;
            max-width: 470px;

            background: rgba(255,255,255,0.97);

            border-radius: 24px;

            padding: 38px 42px 32px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);

            border:
                1px solid rgba(255,255,255,0.7);
        }


        /* ================================
           LOGO
        ================================= */

        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-area img {

            width: 230px;
            max-width: 90%;

            height: auto;

            object-fit: contain;
        }


        /* Jika gambar logo belum ada */

        .logo-fallback {

            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #16a34a
                );

            display: none;

            align-items: center;
            justify-content: center;

            font-size: 42px;
            color: white;

            box-shadow:
                0 10px 25px rgba(13,110,253,0.25);
        }


        /* ================================
           JUDUL
        ================================= */

        .login-title {

            text-align: center;

            font-size: 27px;

            font-weight: 700;

            color: #1e293b;

            margin-top: 15px;
            margin-bottom: 5px;
        }


        .login-subtitle {

            text-align: center;

            font-size: 13px;

            color: #64748b;

            margin-bottom: 30px;
        }


        /* ================================
           FORM
        ================================= */

        .form-label {

            font-size: 15px;

            font-weight: 600;

            color: #334155;

            margin-bottom: 8px;
        }


        .input-group {

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.04);
        }


        .input-group-text {

            background: #ffffff;

            border:
                1px solid #cbd5e1;

            border-right: none;

            color: #64748b;

            padding-left: 16px;
            padding-right: 12px;
        }


        .form-control {

            height: 52px;

            border:
                1px solid #cbd5e1;

            border-left: none;

            font-size: 14px;

            color: #1e293b;

            background: white;
        }


        .form-control:focus {

            box-shadow: none;

            border-color: #0d6efd;
        }


        .input-group:focus-within {

            box-shadow:
                0 0 0 4px rgba(13,110,253,0.15);
        }


        .input-group:focus-within
        .input-group-text {

            border-color: #0d6efd;
        }


        /* ================================
           PASSWORD EYE
        ================================= */

        .password-toggle {

            background: white;

            border:
                1px solid #cbd5e1;

            border-left: none;

            cursor: pointer;

            color: #64748b;

            padding-right: 16px;
        }


        .password-toggle:hover {

            color: #0d6efd;
        }


        /* ================================
           BUTTON LOGIN
        ================================= */

        .btn-login {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #15803d,
                    #16a34a
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            transition: 0.2s;

            box-shadow:
                0 8px 18px rgba(22,163,74,0.25);
        }


        .btn-login:hover {

            background:
                linear-gradient(
                    135deg,
                    #166534,
                    #15803d
                );

            transform:
                translateY(-1px);

            color: white;
        }


        /* ================================
           ERROR
        ================================= */

        .alert-login {

            border-radius: 10px;

            font-size: 13px;

            padding: 10px 14px;

            margin-bottom: 20px;
        }


        /* ================================
           FOOTER
        ================================= */

        .login-footer {

            text-align: center;

            margin-top: 27px;

            padding-top: 20px;

            border-top:
                1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.7;
        }


        /* ================================
           RESPONSIVE HP
        ================================= */

        @media (max-width: 576px) {

            body {

                align-items: center;

                padding:
                    25px 16px;
            }


            .login-card {

                padding:
                    30px 25px 25px;

                border-radius:
                    20px;
            }


            .logo-area img {

                width:
                    200px;
            }


            .login-title {

                font-size:
                    23px;
            }


            .login-subtitle {

                font-size:
                    12px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- ================================
         LOGO SISTEM
    ================================= -->

    <div class="logo-area">

        <img
            src="{{ url_for('static', filename='images/logo1.png') }}"
            alt="Logo Prediksi Langkat"

            onerror="
                this.style.display='none';
                document.getElementById('logoFallback').style.display='flex';
            "
        >


        <div
            class="logo-fallback"
            id="logoFallback">

            <i class="fa-solid fa-chart-line"></i>

        </div>

    </div>



    <!-- ================================
         JUDUL LOGIN
    ================================= -->

    <div class="login-title">

        Login Admin / Pengguna

    </div>


    <div class="login-subtitle">

      
    </div>



    <!-- ================================
         PESAN ERROR
    ================================= -->

    {% if error %}

        <div
            class="alert alert-danger alert-login">

            <i
                class="fa-solid fa-circle-exclamation me-2">
            </i>

            {{ error }}

        </div>

    {% endif %}



    <!-- ================================
         FORM LOGIN
    ================================= -->

    <form
        action="/login"
        method="POST">


        <!-- USERNAME -->

        <div class="mb-3">

            <label
                class="form-label">

                Username

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="fa-solid fa-user"></i>

                </span>


                <input

                    type="text"

                    name="username"

                    class="form-control"

                    placeholder="Masukkan username"

                    autocomplete="username"

                    required

                    autofocus
                >

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="mb-4">

            <label
                class="form-label">

                Password

            </label>


            <div class="input-group">


                <span class="input-group-text">

                    <i class="fa-solid fa-lock"></i>

                </span>


                <input

                    type="password"

                    id="password"

                    name="password"

                    class="form-control"

                    placeholder="Masukkan password"

                    autocomplete="current-password"

                    required
                >


                <button

                    class="password-toggle"

                    type="button"

                    onclick="togglePassword()"

                    aria-label="Tampilkan password">

                    <i
                        id="eyeIcon"
                        class="fa-solid fa-eye">
                    </i>

                </button>


            </div>

        </div>



        <!-- BUTTON LOGIN -->

        <button
            type="submit"
            class="btn-login">

            <i
                class="fa-solid fa-right-to-bracket me-2">
            </i>

            Login

        </button>


    </form>



    <!-- ================================
         FOOTER
    ================================= -->

    <div class="login-footer">

        Sistem Prediksi Produksi Komoditas Perkebunan
        <br>

        Berbasis Data BPS Kabupaten Langkat

        <br>

        &copy; 2026

    </div>


</div>



<!-- ================================
     SHOW / HIDE PASSWORD
================================= -->

<script>

    function togglePassword() {

        const password =
            document.getElementById('password');

        const icon =
            document.getElementById('eyeIcon');


        if (password.type === 'password') {

            password.type = 'text';

            icon.classList.remove('fa-eye');

            icon.classList.add('fa-eye-slash');

        }

        else {

            password.type = 'password';

            icon.classList.remove('fa-eye-slash');

            icon.classList.add('fa-eye');

        }

    }

</script>


</body>

</html>
