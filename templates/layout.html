<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Prediksi Komoditas Perkebunan Langkat{% endblock %}</title>

    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Modern Gradient Header */
        .header-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: white;
            padding: 28px 0 65px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Top Nav Tab */
        .nav-wrapper {
            margin-top: -32px;
        }

        .custom-navbar {
            background: white;
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }

        .custom-navbar .nav-link {
            color: #64748b;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-navbar .nav-link:hover {
            color: #2563eb;
            background-color: #f8fafc;
        }

        .custom-navbar .nav-link.active {
            color: #2563eb;
            background-color: #eff6ff;
            border-bottom: 2px solid #2563eb;
        }

        .main-container {
            flex: 1;
            padding-bottom: 40px;
        }

        /* Footer */
        .custom-footer {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 20px 0;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- Header Atas -->
    <header class="header-bg">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="logo-box">
                        <i class="fa-solid fa-tree text-warning fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-extrabold mb-0 text-white">Sistem Prediksi Komoditas Perkebunan</h4>
                        <p class="mb-0 text-white-50 fs-6 fw-medium">di Kabupaten Langkat</p>
                    </div>
                </div>
                <!-- Kanan Atas: Nama User Dinamis + Tombol Logout -->
<div class="d-none d-md-flex align-items-center gap-3">
    <div class="d-flex align-items-center bg-white bg-opacity-10 px-3 py-2 rounded-pill border border-white border-opacity-20 text-white">
        <i class="fa-solid fa-circle-user me-2 fs-5 text-warning"></i>
        <span class="fw-semibold fs-6">{{ session.get('nama_user', 'Admin') }}</span>
    </div>
    <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm" onclick="return confirm('Apakah Anda yakin ingin keluar?');">
        <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
    </a>
</div>
            </div>
        </div>
    </header>

    <!-- Menu Navigasi Tab -->
    <div class="container nav-wrapper">
        <div class="custom-navbar d-flex justify-content-between align-items-center">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' or request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                        <i class="fa-solid fa-house"></i> Beranda
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/data' %}active{% endif %}" href="/data">
                        <i class="fa-solid fa-database"></i> Data Produksi
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/prediksi' %}active{% endif %}" href="/prediksi">
                        <i class="fa-solid fa-chart-line"></i> Form Prediksi
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/tentang' %}active{% endif %}" href="/tentang">
                        <i class="fa-solid fa-circle-info"></i> Tentang
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="container main-container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="custom-footer mt-auto">
        <div class="container d-flex justify-content-between align-items-center">
            <span>&copy; 2026 Sistem Prediksi Produksi Komoditas Perkebunan Kabupaten Langkat.</span>
            <span class="fw-semibold text-primary"><i class="fa-brands fa-python me-1"></i> Powered by Python Prophet</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
